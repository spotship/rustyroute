name: "ci"

# Lint + test gate for every PR and push to main. Mirrors clickup.yaml's
# lowercase-name + .yaml-extension conventions. Inlined (no reusable
# workflow) because rustyroute is public and spotship/.github's shared
# workflows are private-scoped — see .github/workflows/clickup.yaml
# header for the same rationale.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test-matrix:
    name: test (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # MSRV pinned here MUST match Cargo.toml [package].rust-version.
        # When bumping MSRV, update both places.
        toolchain: [stable, "1.93.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test-${{ matrix.os }}-${{ matrix.toolchain }}
      - run: cargo test --all-features

  features-matrix:
    name: features (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # TODO(ENG-4679): add `--features data-100km` row once the
      # [features] table lands on main. Removed the placeholder row
      # because with no [features] table in Cargo.toml, `flags: ""` is
      # byte-identical to the `default` row below and wastes ~1
      # ubuntu-minute per CI run.
      matrix:
        include:
          - label: "no-default"
            flags: "--no-default-features"
          - label: "all-features"
            flags: "--all-features"
          - label: "default"
            flags: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: features-${{ matrix.label }}
      - run: cargo build ${{ matrix.flags }}

  # ENG-4688: wasm32 cross-compile smoke build. rustyroute's OSS
  # audience includes static, browser-side voyage planners, so the
  # library must keep linking for the wasm32-unknown-unknown target.
  # Nothing else in this file cross-compiles, so an accidental
  # `std::os::unix`, `mio`, or other native-only dependency would pass
  # all three host-OS test rows and only surface downstream. Locked by
  # tests/ci_workflow.rs.
  #
  # Deliberate omissions, all load-bearing:
  #   - No wasm-bindgen: this is a "does it compile?" smoke test, not a
  #     JS binding (that is a future, separately-scoped crate).
  #   - No --all-targets / cargo test: rusqlite (bundled SQLite) and
  #     tempfile are dev-dependencies (Cargo.toml:39-44), and dev-deps
  #     build for the TARGET. Plain `cargo build` is lib-only.
  #   - No --features cli: `cli` (Cargo.toml:22-25) is the placeholder
  #     for the future clap + tokio binary, neither of which builds
  #     here.
  #   - --no-default-features drops data-50km (Cargo.toml:16). The data
  #     features add megabytes, not dependencies, and this job is a
  #     dependency gate.
  #
  # rusqlite is also a build-dependency (Cargo.toml:35-37), which is
  # fine: build-script units compile for the HOST even when
  # cross-compiling, so bundled SQLite never enters this build path.
  # The output is an .rlib, not a .wasm module — the crate declares no
  # cdylib crate-type and no [[bin]] — which is sufficient, since
  # non-wasm crates fail at compile time long before linking.
  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: wasm
      - run: cargo build --target wasm32-unknown-unknown --no-default-features

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: coverage
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: docs
      - run: cargo doc --no-deps --all-features

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      # Pin `pre-commit` so CI stays reproducible. The e2e tests assert
      # on specific pre-commit diagnostic wording (e.g. "No hook with
      # id ..."); an unpinned upstream release could change that
      # wording and cause nondeterministic CI failures.
      - run: pip install 'pre-commit==4.6.0'
      # Cache the hook environments pre-commit builds under
      # ~/.cache/pre-commit (the pre-commit-hooks v5 repo clone + its
      # venv). Keyed on the config hash so a hook/rev change busts the
      # cache; avoids re-cloning on every run and reduces flakiness from
      # transient network errors.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: pre-commit
      # `cargo test --test pre_commit_e2e` exercises pre-commit
      # end-to-end: AC2 (`ac2_pre_commit_run_all_files_passes_on_current_tree`)
      # runs `pre-commit run --all-files` on the repo root and also
      # asserts the tree stays drift-free; AC3 covers the fmt-bad
      # commit path; AC4 covers the manual-stage clippy hook and its
      # default-stage absence. AC2 supersedes a standalone
      # `pre-commit run --all-files` step here — it does the same hook
      # invocation plus the drift check, so running both would
      # duplicate the hook suite and burn CI time. Without pre-commit
      # on PATH, the e2e tests silently skip — installing it above is
      # what makes AC2/AC3/AC4 actually machine-verified rather than
      # self-attested.
      - run: cargo test --test pre_commit_e2e
