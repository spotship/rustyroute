name: "codspeed"

# ENG-4690: continuous performance signal. Builds the criterion benches
# (benches/route.rs) with CodSpeed instrumentation and reports per-PR
# deltas vs main. The >10% hard-fail threshold for
# route_marseille_shanghai_50km is configured in the CodSpeed project
# dashboard (Settings -> performance threshold), not here — the workflow's
# job is to measure and report on every PR. Requires repo secret
# CODSPEED_TOKEN.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmarks:
    name: benchmarks
    # Pinned to 22.04 (not ubuntu-latest / 24.04): CodSpeedHQ/action@v2 runs
    # benches under valgrind instrumentation and only supports Ubuntu 20.04 /
    # 22.04. On ubuntu-latest the "Run benchmarks" step fails with "Only
    # Ubuntu 20.04 and 22.04 are supported at the moment".
    runs-on: ubuntu-22.04
    # PRs that intentionally trade perf for clarity put [skip-perf] in the
    # title and document the regression in CHANGELOG (ENG-4692). On push
    # to main the pull_request title is empty, so the job always runs.
    if: ${{ !contains(github.event.pull_request.title, '[skip-perf]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codspeed
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed
      - name: Build instrumented benchmarks
        run: cargo codspeed build
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v2
        with:
          run: cargo codspeed run
          token: ${{ secrets.CODSPEED_TOKEN }}
