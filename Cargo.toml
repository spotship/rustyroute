[package]
name = "rustyroute"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
description = "Maritime sea-routing library for Rust."
readme = "README.md"
homepage = "https://github.com/spotship/rustyroute"
repository = "https://github.com/spotship/rustyroute"
documentation = "https://docs.rs/rustyroute"
license = "EUPL-1.2"
keywords = ["routing", "maritime", "searoute", "geospatial", "shipping"]
categories = ["algorithms", "science::geo"]

[features]
default = ["data-50km"]
data-5km = []
data-10km = []
data-20km = []
data-50km = []
data-100km = []
# `cli` gates the optional `rustyroute` binary (src/bin/rustyroute.rs,
# ENG-4682). It also turns on every data resolution: `Graph::load`'s
# OUT_DIR step resolves to a build temp dir that no longer exists after
# `cargo install`, so an installed binary can only fall back to the
# static `data::BYTES_{N}KM` slices — it needs all five to honour any
# `--resolution`.
cli = [
    "dep:clap",
    "data-5km",
    "data-10km",
    "data-20km",
    "data-50km",
    "data-100km",
]

# Declared explicitly (rather than relying on src/bin auto-discovery)
# because only an explicit target can carry `required-features`. That is
# what makes a plain `cargo build` skip the binary entirely and never
# compile clap.
[[bin]]
name = "rustyroute"
path = "src/bin/rustyroute.rs"
required-features = ["cli"]

[dependencies]
pathfinding = "4"
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck"] }
thiserror = "1"
# MUST stay on ONE line: tests/changelog.rs:32-43 derives the crate
# version by returning the first Cargo.toml line that trims to a
# `version`-prefixed string, so a multi-line inline table here would
# introduce a second candidate and can misparse the crate version.
clap = { version = "4", features = ["derive"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"

[build-dependencies]
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck", "std"] }
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }

[dev-dependencies]
# Used by tests/tampered_gpkg_panic.rs to exercise the full build pipeline
# (real gpkg_io reader -> csr -> groups) against a tampered .gpkg copy.
# Reuses the bundled SQLite amalgamation already built for [build-dependencies].
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }
tempfile = "3"
# ENG-4681: tests/golden_routes.rs parses tests/fixtures/routes.json (the
# golden-route table). Dev-only; MIT/Apache-2.0, already covered by
# deny.toml's licence allowlist — no library or downstream-consumer impact.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ENG-4683: examples/axum_server.rs (the README's HTTP quickstart).
# Dev-only — no library or downstream-consumer impact, and the wasm CI
# job builds lib-only (`cargo build`, no --all-targets) so these never
# cross-compile. Both MUST stay on ONE line: tests/changelog.rs:32-43
# derives the crate version from the first `version`-prefixed line, so a
# multi-line inline table here would introduce a second candidate.
# `net` is beyond the feature list ENG-4683 originally named: axum::serve
# takes a tokio::net::TcpListener, which that feature gates. axum's own
# `tokio` feature would activate it transitively, but the example names
# the path directly, so we declare it directly.
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
# ENG-4690: CodSpeed's drop-in criterion replacement. Behaves as plain
# criterion under `cargo bench` (incl. html_reports) and registers benches
# with the CodSpeed harness under `cargo codspeed`. Re-exports the full
# criterion 0.5 API, so benches/route.rs is ordinary criterion code.
codspeed-criterion-compat = { version = "2", features = ["html_reports"] }

# NOTE: every [dev-dependencies] entry must stay ABOVE this table —
# [[bench]] starts a new table, so anything added below it would silently
# become part of the bench target instead of a dependency.
[[bench]]
name = "route"
harness = false
